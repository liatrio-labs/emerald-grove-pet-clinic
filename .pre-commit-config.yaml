# Pre-commit hooks for Emerald Grove Veterinary Clinic
# See https://pre-commit.com for more information

repos:
  # Basic file and text processing hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
        description: Removes trailing whitespace
      - id: end-of-file-fixer
        description: Ensures file ends with newline
      - id: check-yaml
        description: Validates YAML syntax (excluding k8s multi-doc files)
        exclude: ^k8s/.*\.yml$
      - id: check-json
        description: Checks JSON files for syntax errors
      - id: check-toml
        description: Checks TOML files for syntax errors
      - id: check-xml
        description: Checks XML files for syntax errors
      - id: check-merge-conflict
        description: Checks for merge conflict markers
      - id: check-case-conflict
        description: Checks for case conflicts on case-insensitive filesystems
      - id: check-added-large-files
        description: Prevents large files from being committed
        args: ["--maxkb=1000"]
      - id: check-executables-have-shebangs
        description: Ensures executables have shebangs
      - id: check-shebang-scripts-are-executable
        description: Ensures scripts with shebangs are executable
      - id: mixed-line-ending
        description: Ensures consistent line endings
        args: ["--fix=lf"]

  # Documentation hooks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: a4d5d37e66ebcd6b3705204a1d6dbb56dea66338  # v0.49.0
    hooks:
      - id: markdownlint
        description: Lints Markdown files
        args: ["--config", ".markdownlint.yaml", "--fix"]

  # Security and dependency checks
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
        description: Detects hardcoded secrets (keys, tokens, credentials) in staged changes

  # Shell script hooks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck
        description: Lints shell scripts for common issues

  # Git hooks
  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98  # v0.19.1
    hooks:
      - id: gitlint
        description: Lints commit messages
        stages: [commit-msg]

  # Spring Boot specific hooks
  - repo: local
    hooks:
      - id: spring-javaformat-apply
        name: Spring Java Format (auto-apply)
        entry: ./mvnw -q spring-javaformat:apply
        language: system
        files: '\.java$'
        pass_filenames: false
        stages: [pre-commit]
        description: Auto-formats Java sources to Spring conventions; re-stage if files change
      - id: maven-test-check
        name: Maven test check
        entry: ./mvnw test
        language: system
        files: '^pom\.xml$|^src/|^\.mvn/'
        pass_filenames: false
        stages: [pre-commit]
        description: Ensures all tests pass before committing
      - id: no-direct-commits-to-main
        name: Block direct commits to main
        entry: >
          bash -c '
          BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null);
          if [ "$BRANCH" = "main" ]; then
          echo "ERROR: Direct commits to main are not allowed. Please create a feature branch.";
          exit 1;
          fi'
        language: system
        always_run: true
        pass_filenames: false
        stages: [commit-msg]
        description: Prevents direct commits to the main branch, enforcing a PR-based workflow

# Configuration options
default_stages: [pre-commit]
fail_fast: false

# Exclude patterns
exclude: |
  (?x)^(
    \.git/.*|
    target/.*|
    \.idea/.*|
    \.vscode/.*|
    .*\.class$|
    .*\.jar$|
    .*\.war$|
    .*\.log$|
    .*\.tmp$|
    node_modules/.*|
    \.DS_Store
  )$

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
