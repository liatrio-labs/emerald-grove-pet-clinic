<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <section class="liatrio-section">
    <div class="liatrio-form-card">
      <h2 th:text="#{vets}">Veterinarians</h2>
      <p class="liatrio-muted" th:text="#{vets.subtitle}">A snapshot of the care team and specialties.</p>

      <form th:action="@{/vets.html}" method="get" class="form-horizontal liatrio-form" id="filter-specialty-form">
        <div class="form-group">
          <div class="control-group" id="specialtyGroup">
            <label for="specialty" class="col-sm-2 control-label" th:text="#{vets.filter.label}">Filter by Specialty</label>
            <div class="col-sm-10">
              <select id="specialty" name="specialty" class="form-control"
                      aria-label="Filter veterinarians by specialty"
                      aria-describedby="specialty-help">
                <option value="all" th:text="#{vets.filter.all}"
                        th:selected="${specialtyFilter == null or specialtyFilter == 'all'}">All Specialties</option>
                <option value="none" th:text="#{vets.filter.none}"
                        th:selected="${specialtyFilter == 'none'}">None (General Practice)</option>
                <option th:each="spec : ${availableSpecialties}"
                        th:value="${spec}"
                        th:text="${spec}"
                        th:selected="${specialtyFilter == spec}">specialty</option>
              </select>
              <small id="specialty-help" class="liatrio-muted" th:text="#{vets.filter.help}">Select a specialty to filter the list, or choose 'All Specialties' to view all veterinarians.</small>
            </div>
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-offset-2 col-sm-10 liatrio-form-actions">
            <button type="submit" class="btn btn-primary" th:text="#{vets.filter.submit}">Filter</button>
          </div>
        </div>
      </form>
    </div>
  </section>

  <section class="liatrio-section">
    <div class="liatrio-table-card">
      <table id="vets" class="table table-striped liatrio-table">
        <thead>
          <tr>
            <th th:text="#{name}">Name</th>
            <th th:text="#{specialties}">Specialties</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="vet : ${listVets}">
            <td th:text="${vet.firstName + ' ' + vet.lastName}"></td>
            <td>
              <span th:each="specialty : ${vet.specialties}" th:text="${specialty.name + ' '}" /> <span
                th:if="${vet.nrOfSpecialties == 0}" th:text="#{none}">none</span>
            </td>
          </tr>
        </tbody>
      </table>

      <div th:if="${#lists.isEmpty(listVets)}" role="status" aria-live="polite" class="liatrio-muted" style="text-align: center; padding: 1rem;">
        <p th:text="#{vets.filter.empty}">No veterinarians found with the selected specialty.</p>
      </div>
    </div>
  </section>

  <div th:if="${totalPages > 1}" class="liatrio-pagination">
    <span th:text="#{pages}">Pages:</span>
    <span>[</span>
    <span th:each="i: ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}" th:href="@{'/vets.html?page=__${i}__&specialty=' + ${specialtyFilter}}">[[${i}]]</a>
      <span th:unless="${currentPage != i}">[[${i}]]</span>
    </span>
    <span>]&nbsp;</span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{'/vets.html?page=1&specialty=' + ${specialtyFilter}}" th:title="#{first}"
        class="fa fa-fast-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{first}" class="fa fa-fast-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{'/vets.html?page=__${currentPage - 1}__&specialty=' + ${specialtyFilter}}" th:title="#{previous}"
        class="fa fa-step-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{previous}" class="fa fa-step-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html?page=__${currentPage + 1}__&specialty=' + ${specialtyFilter}}" th:title="#{next}"
        class="fa fa-step-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{next}" class="fa fa-step-forward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html?page=__${totalPages}__&specialty=' + ${specialtyFilter}}" th:title="#{last}"
        class="fa fa-fast-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{last}" class="fa fa-fast-forward"></span>
    </span>
  </div>
</body>

</html>
