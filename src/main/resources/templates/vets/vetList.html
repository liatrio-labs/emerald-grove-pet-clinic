<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <section class="liatrio-section">
    <div class="liatrio-table-card">
      <div class="liatrio-card-header">
        <h2 th:text="#{vets}">Veterinarians</h2>
        <p class="liatrio-muted" th:text="#{vets.subtitle}">A snapshot of the care team and specialties.</p>
      </div>

      <!-- Specialty Filter -->
      <div class="mb-3" style="padding: 1rem;">
        <label for="specialty-filter" class="form-label" th:text="#{filter.specialty.label}">Specialty Filter</label>
        <select id="specialty-filter" class="form-select" multiple style="max-width: 400px;" onchange="applyFilter()">
          <option value="" th:text="#{filter.specialty.all}">All</option>
          <option value="radiology" th:text="#{filter.specialty.radiology}">Radiology</option>
          <option value="surgery" th:text="#{filter.specialty.surgery}">Surgery</option>
          <option value="dentistry" th:text="#{filter.specialty.dentistry}">Dentistry</option>
        </select>
        <p th:if="${filterActive}" class="mt-2 text-muted">
          <span th:text="#{filter.showing}">Showing vets with specialty:</span>
          <strong th:text="${filterText}">Surgery</strong>
        </p>
      </div>

      <script th:inline="javascript">
        function applyFilter() {
          const select = document.getElementById('specialty-filter');
          const selected = Array.from(select.selectedOptions)
            .map(option => option.value)
            .filter(value => value !== '');

          if (selected.length === 0) {
            window.location.href = '/vets.html';
          } else {
            const filterValue = 'specialty:' + selected.join(',');
            window.location.href = '/vets.html?filter=' + encodeURIComponent(filterValue);
          }
        }
      </script>

      <table id="vets" class="table table-striped liatrio-table">
        <thead>
          <tr>
            <th th:text="#{name}">Name</th>
            <th th:text="#{specialties}">Specialties</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(listVets)}">
            <td colspan="2" class="text-center text-muted py-4">
              <span th:if="${filterActive}" th:text="#{filter.noResults} + ' ' + ${filterText}">No veterinarians found for the selected specialty</span>
              <span th:unless="${filterActive}">No veterinarians found</span>
            </td>
          </tr>
          <tr th:each="vet : ${listVets}">
            <td th:text="${vet.firstName + ' ' + vet.lastName}"></td>
            <td>
              <span th:each="specialty : ${vet.specialties}" th:text="${specialty.name + ' '}" /> <span
                th:if="${vet.nrOfSpecialties == 0}" th:text="#{none}">none</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <div th:if="${totalPages > 1}" class="liatrio-pagination">
    <span th:text="#{pages}">Pages:</span>
    <span>[</span>
    <span th:each="i: ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}" th:href="@{/vets.html(page=${i}, filter=${param.filter})}">[[${i}]]</a>
      <span th:unless="${currentPage != i}">[[${i}]]</span>
    </span>
    <span>]&nbsp;</span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{/vets.html(page=1, filter=${param.filter})}" th:title="#{first}"
        class="fa fa-fast-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{first}" class="fa fa-fast-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{/vets.html(page=${currentPage - 1}, filter=${param.filter})}" th:title="#{previous}"
        class="fa fa-step-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{previous}" class="fa fa-step-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{/vets.html(page=${currentPage + 1}, filter=${param.filter})}" th:title="#{next}"
        class="fa fa-step-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{next}" class="fa fa-step-forward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{/vets.html(page=${totalPages}, filter=${param.filter})}" th:title="#{last}"
        class="fa fa-fast-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{last}" class="fa fa-fast-forward"></span>
    </span>
  </div>
</body>

</html>
