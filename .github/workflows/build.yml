name: Build

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the build only needs to read the repo. Artifact upload
# works with the default read-scoped GITHUB_TOKEN.
permissions:
  contents: read

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest # Docker preinstalled -> Testcontainers integration tests run
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '26' # matches pom.xml java.version and enforcer requireJavaVersion
          cache: maven

      - name: Build, test, verify (Checkstyle + format + JaCoCo gate + enforcer)
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
