name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-review:
    # Automatic on PR events, OR interactive with @claude mention
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone sufficient for reviews

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          include_fix_links: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request with focus on:

            **TDD Compliance:**
            - Are tests written before implementation? (Red-Green-Refactor cycle)
            - Does test coverage meet 90% minimum requirement?
            - Are edge cases and error conditions tested?

            **Code Quality:**
            - SOLID principles applied
            - No code duplication (DRY)
            - Meaningful names and clear structure
            - Proper error handling

            **Spring Boot Best Practices:**
            - Correct use of annotations (@Entity, @Controller, @Service, @Repository)
            - Proper dependency injection patterns
            - Layered architecture maintained (Presentation → Business → Data)
            - Appropriate use of Spring Data JPA

            **Security:**
            - Input validation with Bean Validation (JSR-303)
            - No SQL injection vulnerabilities (parameterized queries)
            - Proper output encoding (XSS prevention)

            **Architecture:**
            - Feature-based package structure followed
            - Repository pattern correctly implemented
            - Aggregate boundaries respected (Owner→Pet→Visit, Vet→Specialty)

            Reference the project's CLAUDE.md, docs/TESTING.md, and docs/ARCHITECTURE.md for detailed guidelines.

            Note: The PR branch is already checked out in the current working directory.

            **Instructions:**
            - Use `gh pr comment` for top-level feedback and summary
            - Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues with suggestions
            - Be thorough but concise
            - Provide constructive, actionable feedback
            - Don't use emojis
            - Structure output with clear sections for critical issues, important improvements, and positive feedback
            - Only post GitHub comments - don't submit review text as messages

          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git:*)"
