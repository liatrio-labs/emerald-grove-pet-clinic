# Dependabot version updates for Emerald Grove Veterinary Clinic.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Each ecosystem runs weekly, batches minor + patch bumps into a single grouped
# PR (majors stay individual for review), uses conventional-commit prefixes to
# match the repo's gitlint convention, and is labelled "dependencies".
version: 2
updates:
  # Java application + build/test dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by the CI workflows (keeps the SHA pins fresh)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        update-types: ["minor", "patch"]

  # Playwright end-to-end test suite
  - package-ecosystem: "npm"
    directory: "/e2e-tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # Devcontainer / Gitpod base image
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  # Local database images (MySQL / PostgreSQL) used for dev and integration tests
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-compose:
        update-types: ["minor", "patch"]
